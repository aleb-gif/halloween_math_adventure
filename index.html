<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Halloween Math Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Mitr:wght@600&family=Creepster&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #ffca28;
      --gold-dark: #ff8f00;
      --purple: #31144f;
      --magic-cyan: #00e5ff;
      --pumpkin: #ff6d00;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0717;
      font-family: 'Fredoka One', cursive, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-height: 100vh;
      max-width: 100vw;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      overflow: hidden;
      background-color: #0e0920;
    }
    @media (min-aspect-ratio: 16/9) {
      #game-stage {
        width: 177.78vh;
        height: 100vh;
      }
    }
    @media (max-aspect-ratio: 16/9) {
      #game-stage {
        width: 100vw;
        height: 56.25vw;
      }
    }
    #bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://i.postimg.cc/4yJbQKW9/sfondo.jpg');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      z-index: 1;
    }
    #vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 55%, rgba(13, 8, 28, 0.15) 0%, rgba(10, 5, 20, 0.45) 80%, rgba(5, 2, 10, 0.85) 100%);
      z-index: 2;
      pointer-events: none;
    }
    .firefly {
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: #fffa7a;
      border-radius: 50%;
      filter: blur(1px);
      box-shadow: 0 0 10px #ffe53b, 0 0 20px #ff9100;
      z-index: 3;
      pointer-events: none;
      animation: floatFirefly 5s infinite alternate ease-in-out;
    }
    @keyframes floatFirefly {
      0% { transform: translateY(0) scale(0.8); opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-30px) translateX(20px) scale(1.3); opacity: 0.4; }
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 3% 4%;
    }
    .character-wrap {
      position: relative;
      width: clamp(220px, 35vw, 420px);
      max-height: 28vh;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.85));
      animation: mascotBounce 2.5s infinite ease-in-out alternate;
    }
    @keyframes mascotBounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }
    .character-wrap img {
      width: 100%;
      height: auto;
      max-height: 28vh;
      object-fit: contain;
      display: block;
    }
    .ingame-character-box {
      width: clamp(110px, 16vw, 160px);
      height: clamp(110px, 17vh, 150px);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.85));
      animation: inGameFloat 2.2s infinite alternate ease-in-out;
      margin-bottom: 0.2%;
    }
    @keyframes inGameFloat {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-7px) scale(1.02); }
    }
    .ingame-single-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
    .cheer {
      animation: cheerJump 0.6s ease !important;
    }
    @keyframes cheerJump {
      0%, 100% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-22px) scale(1.15) rotate(-5deg); }
      70% { transform: translateY(-15px) scale(1.15) rotate(5deg); }
    }
    .disappointed {
      animation: disShake 0.5s ease-in-out !important;
    }
    @keyframes disShake {
      0%, 100% { transform: translateX(0) rotate(0deg) scale(1); }
      20% { transform: translateX(-12px) rotate(-8deg) scale(0.95); }
      40% { transform: translateX(10px) rotate(8deg) scale(0.95); }
      60% { transform: translateX(-8px) rotate(-5deg) scale(0.95); }
      80% { transform: translateX(6px) rotate(4deg) scale(0.95); }
    }
    .btn-fantasy {
      position: relative;
      cursor: pointer;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.6rem, 3.2vw, 2.8rem);
      color: #fff;
      padding: 14px 48px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(180deg, #ff9100 0%, #ff5722 55%, #c42b00 100%);
      box-shadow: 0 8px 0 #681900, 0 14px 25px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 110, 0, 0.65), inset 0 4px 6px rgba(255, 255, 255, 0.5);
      text-shadow: 0 3px 4px rgba(0, 0, 0, 0.5);
      letter-spacing: 2px;
      transition: all 0.1s ease;
      margin-bottom: 2%;
      outline: none;
      z-index: 30;
    }
    .btn-fantasy:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 11px 0 #681900, 0 18px 30px rgba(0, 0, 0, 0.8), 0 0 50px rgba(255, 140, 0, 0.85);
    }
    .btn-fantasy:active {
      transform: translateY(6px) scale(0.98);
      box-shadow: 0 2px 0 #681900, 0 6px 15px rgba(0, 0, 0, 0.6);
    }
    .hud-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2%;
    }
    .hud-jewel {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(38, 15, 68, 0.95), rgba(20, 8, 38, 0.95));
      padding: 6px 18px;
      border-radius: 35px;
      border: 3px solid #ffaa00;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(255, 170, 0, 0.3);
      color: #fff;
    }
    .jewel-icon {
      font-size: 1.4rem;
      filter: drop-shadow(0 0 8px #ffb300);
    }
    .hud-label {
      font-size: clamp(0.8rem, 1.4vw, 1.1rem);
      color: #ffd54f;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hud-val {
      font-size: clamp(1.2rem, 2.2vw, 1.9rem);
      color: #ffffff;
      margin-left: 4px;
      text-shadow: 0 0 10px var(--magic-cyan);
    }
    .math-tablet {
      position: relative;
      width: clamp(260px, 44vw, 500px);
      padding: 12px 20px;
      background: linear-gradient(145deg, rgba(48, 20, 78, 0.94), rgba(25, 10, 42, 0.96));
      border: 4px solid #ba68c8;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), 0 0 40px rgba(186, 104, 200, 0.3);
      text-align: center;
      margin: 0 auto;
    }
    .math-tablet::before {
      content: '◆ SOLVE THE MAGIC ◆';
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      background: #7b1fa2;
      color: #e1bee7;
      font-size: 0.72rem;
      padding: 2px 12px;
      border-radius: 12px;
      border: 2px solid #ce93d8;
      letter-spacing: 1px;
    }
    .formula-text {
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      color: #ffffff;
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.8), 0 0 20px var(--magic-cyan);
      letter-spacing: 4px;
      display: inline-block;
      animation: glowPulse 2s infinite alternate ease-in-out;
    }
    @keyframes glowPulse {
      0% { text-shadow: 0 4px 8px rgba(0,0,0,0.8), 0 0 15px rgba(0, 229, 255, 0.5); }
      100% { text-shadow: 0 4px 8px rgba(0,0,0,0.8), 0 0 35px rgba(0, 229, 255, 0.9), 0 0 10px #fff; }
    }
    #feedback-msg {
      min-height: 1.6rem;
      font-size: clamp(0.9rem, 1.6vw, 1.4rem);
      color: #ffe082;
      text-align: center;
      text-shadow: 0 3px 6px rgba(0,0,0,0.9), 0 0 12px #ff6f00;
      margin-top: 0.2%;
      margin-bottom: 0.2%;
    }
    .answers-row {
      display: flex;
      justify-content: center;
      gap: clamp(12px, 3.5vw, 35px);
      width: 100%;
      max-width: 800px;
      margin-bottom: 1%;
    }
    .btn-rune {
      position: relative;
      flex: 1;
      max-width: 190px;
      height: clamp(70px, 11vw, 115px);
      background: linear-gradient(180deg, #ffaa00 0%, #e65100 60%, #9e2a00 100%);
      border: 4px solid #ffecb3;
      border-radius: 24px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 0 #541700, 0 12px 22px rgba(0, 0, 0, 0.8), inset 0 4px 6px rgba(255, 255, 255, 0.6);
      transition: all 0.12s ease;
      outline: none;
    }
    .btn-rune span {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2.4rem, 4.8vw, 3.6rem);
      color: #ffffff;
      text-shadow: 0 4px 5px rgba(0, 0, 0, 0.6);
      transform: translateY(-2px);
    }
    .btn-rune:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 12px 0 #541700, 0 18px 28px rgba(0, 0, 0, 0.9);
    }
    .btn-rune:active {
      transform: translateY(6px) scale(0.97);
      box-shadow: 0 2px 0 #541700, 0 4px 12px rgba(0, 0, 0, 0.6);
    }
    .btn-rune.correct {
      background: linear-gradient(180deg, #00e676 0%, #00a152 70%, #00600f 100%) !important;
      border-color: #b9f6ca !important;
      box-shadow: 0 0 35px #00e676, 0 6px 0 #004d40 !important;
      transform: scale(1.06) !important;
    }
    .btn-rune.wrong {
      background: linear-gradient(180deg, #ff5252 0%, #c62828 70%, #6e0000 100%) !important;
      border-color: #ffcdd2 !important;
      animation: shake 0.4s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
    .congrats-card {
      background: linear-gradient(145deg, rgba(49, 16, 82, 0.96), rgba(24, 7, 43, 0.98));
      border: 4px solid var(--gold);
      border-radius: 30px;
      padding: 4% 5%;
      text-align: center;
      box-shadow: 0 0 50px rgba(255, 170, 0, 0.4);
      max-width: 580px;
    }
  </style>
</head>
<body>

  <!-- Audio collegato al tuo file MP3 su GitHub -->
  <audio id="bg-audio" loop preload="auto">
    <source src="https://raw.githubusercontent.com/aleb-gif/gioco-halloween-audio/main/musica.mp3.mp3" type="audio/mpeg">
  </audio>

  <div id="game-stage">
    <div id="bg-layer"></div>
    <div id="vignette"></div>

    <div class="firefly" style="top: 65%; left: 32%; animation-delay: 0s;"></div>
    <div class="firefly" style="top: 72%; left: 58%; animation-delay: 1.4s;"></div>
    <div class="firefly" style="top: 55%; left: 45%; animation-delay: 2.3s;"></div>
    <div class="firefly" style="top: 60%; left: 75%; animation-delay: 0.8s;"></div>

    <!-- 1. START SCREEN -->
    <div id="start-screen" class="screen">
      <div id="title-container" style="text-align:center; margin-top:2%;">
        <h1 style="font-family:'Creepster', cursive; font-size:clamp(2.8rem, 6.2vw, 5.5rem); color:#ff9d00; text-shadow:0 4px 0 #9c3f00, 0 8px 0 #572000, 0 0 25px rgba(255,170,0,0.8); letter-spacing:3px; line-height:1.1;">
          HALLOWEEN<br>MATH ADVENTURE
        </h1>
      </div>

      <div class="character-wrap">
        <img class="mascot-src" src="https://i.postimg.cc/jSVCVVrf/mascotte.png" alt="Halloween Mascot">
      </div>

      <button id="btn-play" class="btn-fantasy" type="button" onclick="startGame()">PLAY!</button>
    </div>

    <!-- 2. GAME SCREEN -->
    <div id="game-screen" class="screen" style="display: none;">
      <div class="hud-top">
        <div class="hud-jewel">
          <span class="jewel-icon">🎃</span>
          <span class="hud-label">SCORE:</span>
          <span id="score-text" class="hud-val">0</span>
        </div>
        <div class="hud-jewel">
          <span class="jewel-icon">📜</span>
          <span class="hud-label">LEVEL:</span>
          <span id="progress-text" class="hud-val">1 / 10</span>
        </div>
      </div>

      <div class="ingame-character-box" id="ingame-character-box">
        <img id="ingame-single-img" class="ingame-single-img" src="https://i.postimg.cc/7YzYnBTT/frank-png.png" alt="Character">
      </div>

      <div class="math-tablet">
        <div id="question-text" class="formula-text">3 + 4 = ?</div>
      </div>

      <div id="feedback-msg">Tap the right magic rune!</div>

      <div class="answers-row">
        <button class="btn-rune" id="btn-ans-0" type="button"><span>?</span></button>
        <button class="btn-rune" id="btn-ans-1" type="button"><span>?</span></button>
        <button class="btn-rune" id="btn-ans-2" type="button"><span>?</span></button>
      </div>
    </div>

    <!-- 3. END SCREEN -->
    <div id="end-screen" class="screen" style="display: none;">
      <div class="congrats-card">
        <h2 style="font-family:'Creepster'; font-size:clamp(2.2rem, 4.5vw, 3.8rem); color:var(--gold); margin-bottom:10px; text-shadow:0 0 20px #ff6f00;">FANTASTIC!</h2>
        
        <div class="character-wrap" style="width:220px; height:105px; margin: 0 auto 10px auto;">
          <img class="mascot-src" src="https://i.postimg.cc/jSVCVVrf/mascotte.png" alt="Halloween Mascot">
        </div>

        <p style="font-size:clamp(1.1rem, 1.8vw, 1.5rem); color:#fff; margin-bottom:16px;">You mastered all the castle's magic!</p>
        <div class="hud-jewel" style="display:inline-flex; margin-bottom:20px;">
          <span class="jewel-icon">⭐</span>
          <span class="hud-label">Final Score:</span>
          <span id="final-score" class="hud-val">10</span>
        </div>
        <br>
        <button id="btn-restart" class="btn-fantasy" type="button" style="margin-bottom:0;" onclick="startGame()">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <script>
    const variantiPersonaggi = [
      ['https://i.postimg.cc/7YzYnBTT/frank-png.png'],
      ['https://i.postimg.cc/13cmLfHk/strega-png.png'],
      ['https://i.postimg.cc/rsByL47L/fantasma-png.png']
    ];

    let personaggioAttuale = 0;

    const totalQuestions = 10;
    let currentStep = 0;
    let score = 0;
    let currentCorrectAnswer = 0;
    let isAnsweringBlocked = false;

    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const endScreen = document.getElementById('end-screen');
    const questionText = document.getElementById('question-text');
    const scoreText = document.getElementById('score-text');
    const progressText = document.getElementById('progress-text');
    const feedbackMsg = document.getElementById('feedback-msg');
    const finalScore = document.getElementById('final-score');
    const ingameSingleImg = document.getElementById('ingame-single-img');
    const inGameMascotBox = document.getElementById('ingame-character-box');
    const bgAudio = document.getElementById('bg-audio');
    const answerButtons = [
      document.getElementById('btn-ans-0'),
      document.getElementById('btn-ans-1'),
      document.getElementById('btn-ans-2')
    ];

    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function avviaMusicaDiFondo() {
      if (bgAudio) {
        bgAudio.volume = 0.5;
        bgAudio.play().catch(e => {
          console.log("Audio autoplay prevented or interaction needed", e);
        });
      }
    }

    function playSound(type) {
      try {
        const ctx = getAudioContext();
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
          osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        } else if (type === 'wrong') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(164.81, now + 0.25);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'click') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (e) {}
    }

    function aggiornaPersonaggioInGame() {
      ingameSingleImg.src = variantiPersonaggi[personaggioAttuale][0];
      personaggioAttuale = (personaggioAttuale + 1) % variantiPersonaggi.length;
    }

    function startGame() {
      const ctx = getAudioContext();
      if (ctx && ctx.state === 'suspended') ctx.resume();

      playSound('click');
      avviaMusicaDiFondo();

      score = 0;
      currentStep = 0;
      personaggioAttuale = 0;
      scoreText.textContent = score;

      startScreen.style.display = 'none';
      endScreen.style.display = 'none';
      gameScreen.style.display = 'flex';

      nextQuestion();
    }

    function nextQuestion() {
      if (currentStep >= totalQuestions) {
        showEndScreen();
        return;
      }

      currentStep++;
      progressText.textContent = `${currentStep} / ${totalQuestions}`;
      feedbackMsg.textContent = "Tap the right magic rune!";
      feedbackMsg.style.color = "#ffe082";
      isAnsweringBlocked = false;

      aggiornaPersonaggioInGame();

      const sum = Math.floor(Math.random() * 9) + 2;
      const a = Math.floor(Math.random() * (sum - 1)) + 1;
      const b = sum - a;
      currentCorrectAnswer = sum;

      questionText.textContent = `${a} + ${b} = ?`;

      const options = new Set();
      options.add(currentCorrectAnswer);

      while (options.size < 3) {
        const offset = (Math.random() < 0.5 ? -1 : 1) * (Math.floor(Math.random() * 2) + 1);
        let fake = currentCorrectAnswer + offset;
        if (fake < 0) fake = 0;
        if (fake > 10) fake = 10 - Math.floor(Math.random() * 3);
        if (fake !== currentCorrectAnswer) {
          options.add(fake);
        }
      }

      const shuffled = Array.from(options).sort(() => Math.random() - 0.5);

      answerButtons.forEach((btn, index) => {
        btn.classList.remove('correct', 'wrong');
        btn.querySelector('span').textContent = shuffled[index];
        btn.onclick = () => handleAnswer(shuffled[index], btn);
      });
    }

    function handleAnswer(selectedVal, btnElement) {
      if (isAnsweringBlocked) return;

      if (selectedVal === currentCorrectAnswer) {
        isAnsweringBlocked = true;
        score++;
        scoreText.textContent = score;
        btnElement.classList.add('correct');
        playSound('correct');

        inGameMascotBox.classList.remove('disappointed');
        inGameMascotBox.classList.add('cheer');
        setTimeout(() => inGameMascotBox.classList.remove('cheer'), 650);

        const praise = ["Awesome! ✨", "Magic! 🎃", "Great Job! 🦇", "Super Star! 🌟"];
        feedbackMsg.textContent = praise[Math.floor(Math.random() * praise.label)];
        feedbackMsg.style.color = "#69f0ae";

        setTimeout(() => {
          nextQuestion();
        }, 1100);
      } else {
        playSound('wrong');
        btnElement.classList.add('wrong');
        
        inGameMascotBox.classList.remove('cheer');
        inGameMascotBox.classList.add('disappointed');
        setTimeout(() => inGameMascotBox.classList.remove('disappointed'), 550);

        feedbackMsg.textContent = "Almost! Try counting again 🧙‍♂️";
        feedbackMsg.style.color = "#ff8a80";

        setTimeout(() => {
          btnElement.classList.remove('wrong');
        }, 500);
      }
    }

    function showEndScreen() {
      gameScreen.style.display = 'none';
      endScreen.style.display = 'flex';
      finalScore.textContent = `${score} / ${totalQuestions}`;
      playSound('correct');
    }
  </script>
</body>
</html>
